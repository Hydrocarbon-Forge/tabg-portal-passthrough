# portal_passthrough.cfg — read by passthrough.dll on Load() from the game's
# working dir (the Portal root, next to hl2.exe). key=value, '#' comments.
# install.sh copies this next to the exe as portal_passthrough.cfg.

# Link hub (src/link/link.py). Guest connects to ws://ws_host:ws_port.
ws_host=127.0.0.1
ws_port=25600

# Export resolution / shared-memory mapping name (framechannel.md).
width=1920
height=1080
channel_name=TABGPortalFrame

# Depth export route (recon/portal-notes.md §3, camera.md):
#   renderpass = second depth pass into an R32F RT via the material system
#                (preferred, engine-sanctioned, portal-aware)
#   intz       = D3D9 INTZ depth-texture readback (fallback, invasive)
depth_method=renderpass

# Source CViewSetup near/far used to linearise the exported depth on the host.
near_z=7
far_z=28000
